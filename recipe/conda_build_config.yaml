# The set of SNAP versions this recipe can build.
#
# NOTE: version selection is driven by the SNAP_VERSION environment variable
# (see meta.yaml + scripts/resolve.py), NOT by a build matrix here — each build
# targets exactly one version so its installer URL/sha256/JDK are unambiguous.
# This list is documentation + a guard used by CI to enumerate the matrix.
snap_version:
  - "9.0.0"
  - "10.0.0"
  - "11.0.0"
  - "12.0.0"
  - "13.0.0"
