name: build

# Build esa-snap-s1tbx-gpt conda packages across {SNAP version} x {OS/arch} on native
# runners, then publish to the anaconda.org channel and attach to the Release.
#
# Required repo secret: ANACONDA_TOKEN (a token for the target anaconda.org channel).
# Target anaconda.org owner/channel: sarforge.
# Trigger a full publish by pushing a tag like `v13.0.0-1`, or run manually.

on:
  workflow_dispatch:
    inputs:
      versions:
        description: "Space-separated SNAP versions to build (default: all)"
        default: "9.0.0 10.0.0 11.0.0 12.0.0 13.0.0"
      publish:
        description: "Upload to anaconda.org + Release"
        type: boolean
        default: false
  push:
    tags: ["v*"]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  matrix:
    # Turn the version input into a JSON matrix axis.
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.set.outputs.versions }}
    steps:
      - id: set
        run: |
          RAW="${{ github.event.inputs.versions }}"
          [ -z "$RAW" ] && RAW="9.0.0 10.0.0 11.0.0 12.0.0 13.0.0"
          JSON=$(printf '%s\n' $RAW | jq -R . | jq -s -c .)
          echo "versions=$JSON" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    strategy:
      fail-fast: false
      matrix:
        snap: ${{ fromJSON(needs.matrix.outputs.versions) }}
        target:
          - { os: ubuntu-latest,  subdir: linux-64 }
          - { os: windows-latest, subdir: win-64 }
          - { os: macos-15-intel, subdir: osx-64 }     # Intel
          - { os: macos-14,       subdir: osx-arm64 }  # Apple Silicon
    runs-on: ${{ matrix.target.os }}
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: build
          channels: conda-forge

      - name: Install build tooling
        run: |
          conda install -y -c conda-forge conda-build anaconda-client pyyaml ruamel.yaml

      - name: Resolve installer (skip absent cells)
        id: resolve
        run: |
          set +e
          OUT=$(python scripts/resolve.py "${{ matrix.snap }}" "${{ matrix.target.subdir }}" --allow-missing-sha)
          RC=$?
          set -e
          if [ "$RC" = "3" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ matrix.snap }}/${{ matrix.target.subdir }} not available upstream — skipping"
            exit 0
          fi
          [ "$RC" = "0" ] || { echo "$OUT"; echo "resolve failed"; exit 1; }
          echo "$OUT" >> "$GITHUB_ENV"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: conda build
        if: steps.resolve.outputs.skip != 'true'
        run: |
          conda-build recipe/ \
            --no-anaconda-upload \
            --output-folder "${{ runner.temp }}/out"

      - name: List build output
        if: steps.resolve.outputs.skip != 'true'
        run: |
          find "${{ runner.temp }}/out" -type f -print

      - name: Upload build artifact
        if: steps.resolve.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: esa-snap-s1tbx-gpt-${{ matrix.snap }}-${{ matrix.target.subdir }}
          path: |
            ${{ runner.temp }}/out/**/*.conda
            ${{ runner.temp }}/out/**/*.tar.bz2
          if-no-files-found: error

      - name: pyroSAR auto-detect check (unix)
        if: steps.resolve.outputs.skip != 'true' && runner.os != 'Windows'
        run: |
          conda create -y -n verify -c "file://${{ runner.temp }}/out" -c conda-forge esa-snap-s1tbx-gpt pyrosar
          conda run -n verify python tests/test_pyrosar.py

      - name: Publish to anaconda.org
        if: steps.resolve.outputs.skip != 'true' && (github.event.inputs.publish == 'true' || startsWith(github.ref, 'refs/tags/'))
        env:
          ANACONDA_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
          ANACONDA_OWNER: ${{ secrets.ANACONDA_OWNER }}
        run: |
          test -n "$ANACONDA_TOKEN" || { echo "ANACONDA_TOKEN not set"; exit 1; }
          test -n "$ANACONDA_OWNER" || { echo "ANACONDA_OWNER not set"; exit 1; }
          find "${{ runner.temp }}/out" \( -name '*.conda' -o -name '*.tar.bz2' \) -exec \
            anaconda -t "$ANACONDA_TOKEN" upload --user "$ANACONDA_OWNER" --force --no-progress {} +

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*.conda
            dist/**/*.tar.bz2
          generate_release_notes: true
