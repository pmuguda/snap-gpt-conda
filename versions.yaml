# versions.yaml — single source of truth for snap-gpt conda packaging.
#
# One entry per supported stable SNAP release. For each release we record the
# official ESA install4j installer filename per conda subdir, its sha256, and
# the JDK the release runs on.
#
# IMPORTANT:
#   * sha256 values MUST be filled by `python scripts/compute-hashes.py`
#     (it downloads each installer and writes the real hash back here).
#     Never hand-edit or guess a hash — a wrong hash fails the build loudly,
#     but a *guessed-but-valid-looking* hash is worse: it can mask a swapped file.
#   * Cells that don't exist upstream (e.g. no native osx-arm64 for old SNAP)
#     must be omitted / left as `null` — the build skips them.
#   * The installer naming scheme changed at SNAP 10: 8/9 shipped a single
#     `*_unix_*.sh` (Linux + Intel mac) and no ARM; 10+ split per-OS with
#     `linux-`, `windows-`, `macos_intel-`, `macos_arm-` and hyphenated versions.
#
# Edition: we always fetch the "sentinel" edition (microwave + optical) and prune
# the optical toolboxes (s2tbx/s3tbx) at build time, keeping the full SAR stack
# (snap engine + s1tbx + rstb).

base_url: https://download.esa.int/step/snap
edition: sentinel

# conda subdirs we target, mapped to the ESA installer OS token (10+ scheme).
subdirs:
  linux-64:  { os_token: linux,       ext: sh,  arch: x86_64 }
  win-64:    { os_token: windows,     ext: exe, arch: x86_64 }
  osx-64:    { os_token: macos_intel, ext: dmg, arch: x86_64 }
  osx-arm64: { os_token: macos_arm,   ext: dmg, arch: arm64  }

versions:

  # ---- 13.0.0 — filenames CONFIRMED from step.esa.int download page (Oct 2025)
  "13.0.0":
    dir: "13.0"
    jdk: "11"           # TODO verify: SNAP 13 supported JVM (11 or 17)
    installers:
      linux-64:   { file: esa-snap_sentinel_linux-13.0.0.sh,        sha256: null }
      win-64:     { file: esa-snap_sentinel_windows-13.0.0.exe,     sha256: null }
      osx-64:     { file: esa-snap_sentinel_macos_intel-13.0.0.dmg, sha256: null }
      osx-arm64:  { file: esa-snap_sentinel_macos_arm-13.0.0.dmg,   sha256: null }

  # ---- 12.0.0 — UNVERIFIED filenames (10+ scheme); compute-hashes.py confirms/repairs
  "12.0.0":
    dir: "12.0"
    jdk: "11"
    installers:
      linux-64:   { file: esa-snap_sentinel_linux-12.0.0.sh,        sha256: null }
      win-64:     { file: esa-snap_sentinel_windows-12.0.0.exe,     sha256: null }
      osx-64:     { file: esa-snap_sentinel_macos_intel-12.0.0.dmg, sha256: null }
      osx-arm64:  { file: esa-snap_sentinel_macos_arm-12.0.0.dmg,   sha256: null }

  # ---- 11.0.0 — UNVERIFIED filenames; compute-hashes.py confirms/repairs
  "11.0.0":
    dir: "11.0"
    jdk: "11"
    installers:
      linux-64:   { file: esa-snap_sentinel_linux-11.0.0.sh,        sha256: null }
      win-64:     { file: esa-snap_sentinel_windows-11.0.0.exe,     sha256: null }
      osx-64:     { file: esa-snap_sentinel_macos_intel-11.0.0.dmg, sha256: null }
      osx-arm64:  { file: esa-snap_sentinel_macos_arm-11.0.0.dmg,   sha256: null }

  # ---- 10.0.0 — UNVERIFIED; arm mac availability to confirm (may be null)
  "10.0.0":
    dir: "10.0"
    jdk: "11"
    installers:
      linux-64:   { file: esa-snap_sentinel_linux-10.0.0.sh,        sha256: null }
      win-64:     { file: esa-snap_sentinel_windows-10.0.0.exe,     sha256: null }
      osx-64:     { file: esa-snap_sentinel_macos_intel-10.0.0.dmg, sha256: null }
      osx-arm64:  { file: esa-snap_sentinel_macos_arm-10.0.0.dmg,   sha256: null }

  # ---- 9.0.0 — OLD naming scheme: single `unix` .sh (Linux + Intel mac), NO ARM.
  #      compute-hashes.py must confirm the exact token (`9_0_0` vs `9_0`).
  "9.0.0":
    dir: "9.0"
    jdk: "11"
    installers:
      linux-64:   { file: esa-snap_sentinel_unix_9_0_0.sh,     sha256: null }
      win-64:     { file: esa-snap_sentinel_windows_9_0_0.exe, sha256: null }
      osx-64:     { file: esa-snap_sentinel_unix_9_0_0.sh,     sha256: null }
      osx-arm64:  null   # no native Apple-Silicon build for SNAP 9
