# versions.yaml — single source of truth for esa-snap-s1tbx-gpt conda packaging.
#
# One entry per supported stable SNAP release. For each retained release/subdir
# we record the official ESA install4j installer filename, its sha256, and the
# JDK the release runs on.
#
# IMPORTANT:
#   * sha256 values MUST be filled by `python scripts/compute-hashes.py`
#     (it downloads each installer and writes the real hash back here).
#     Never hand-edit or guess a hash — a wrong hash fails the build loudly,
#     but a *guessed-but-valid-looking* hash is worse: it can mask a swapped file.
#   * Cells that don't exist upstream (e.g. no native osx-arm64 for old SNAP)
#     must be omitted / left as `null` — the build skips them.
#   * Installer naming changed across releases. Keep filenames pinned to the
#     official STEP links; older releases do not have native osx-arm64 builds.
#
# Edition: prefer the "sentinel" installers (microwave + optical). SNAP 12's
# previous-version page exposes "all" installers instead. In both cases we prune
# optical toolboxes at build time, keeping the full SAR stack (snap engine +
# s1tbx + rstb).
#
# Retention policy for the public sarforge channel:
#   * SNAP 9-11: Linux only, for reproducible older workflows.
#   * SNAP 12: Linux + Apple Silicon macOS.
#   * SNAP 13: Linux + Windows + Apple Silicon macOS.

base_url: https://download.esa.int/step/snap
edition: sentinel

# conda subdirs we target, mapped to the ESA installer OS token (10+ scheme).
subdirs:
  linux-64:  { os_token: linux,       ext: sh,  arch: x86_64 }
  win-64:    { os_token: windows,     ext: exe, arch: x86_64 }
  osx-64:    { os_token: macos_intel, ext: dmg, arch: x86_64 }
  osx-arm64: { os_token: macos_arm,   ext: dmg, arch: arm64  }

versions:

  # ---- 13.0.0 — filenames CONFIRMED from step.esa.int download page (Oct 2025)
  "13.0.0":
    dir: "13.0"
    build_number: 2     # build 1 starts but can crash on Linux without headless/update JVM flags
    jdk: "21"
    installers:
      linux-64:   { file: esa-snap_sentinel_linux-13.0.0.sh,        sha256: null }
      win-64:     { file: esa-snap_sentinel_windows-13.0.0.exe,     sha256: null }
      osx-64:     null
      osx-arm64:  { file: esa-snap_sentinel_macos_arm-13.0.0.dmg,   sha256: null }

  # ---- 12.0.0 — official "All Toolboxes" installers. STEP provides one Mac
  #      DMG; build/test it on both Intel and Apple Silicon runners.
  "12.0.0":
    dir: "12.0"
    jdk: "21"
    installers:
      linux-64:   { file: esa-snap_all_linux-12.0.0.sh,        sha256: null }
      win-64:     null
      osx-64:     null
      osx-arm64:  { file: esa-snap_all_macos-12.0.0.dmg,       sha256: null }

  # ---- 11.0.0 — official Sentinel installers; no native ARM mac build.
  "11.0.0":
    dir: "11.0"
    build_number: 1     # build 0 can crash on Linux without headless/update JVM flags
    jdk: "11"
    installers:
      linux-64:   { file: esa-snap_sentinel_linux-11.0.0.sh,    sha256: null }
      win-64:     null
      osx-64:     null
      osx-arm64:  null

  # ---- 10.0.0 — official Sentinel installers; no native ARM mac build.
  "10.0.0":
    dir: "10_0"
    jdk: "11"
    installers:
      linux-64:   { file: esa-snap_sentinel_linux-10.0.0.sh,    sha256: null }
      win-64:     null
      osx-64:     null
      osx-arm64:  null

  # ---- 9.0.0 — old naming scheme; no native ARM mac build.
  "9.0.0":
    dir: "9.0"
    jdk: "8"
    installers:
      linux-64:   { file: esa-snap_sentinel_unix_9_0_0.sh,          sha256: null }
      win-64:     null
      osx-64:     null
      osx-arm64:  null   # no native Apple-Silicon build for SNAP 9
